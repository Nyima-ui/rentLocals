name: Scrape and Insert Listing

on:
  schedule:
    # Runs at 00:00 UTC on Sun, Mon, Wed, Fri
    - cron: "0 0 * * 0,1,3,5"
  workflow_dispatch:

jobs:
  scrape-and-insert:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger listing ingestion API
        run: |
          curl -X GET "https://rent-locals.vercel.app/api/listings" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"